# Each module has a playground, a graded module lab and a quiz. Each section ends with a capstone lab. Layout: sections/section-0X0/{README.md,quiz.yaml,module-01/,capstone/}. Labs and playgrounds are untested.
training:
  id: ATS043
  title: 'KCSA: Kubernetes Security Fundamentals'
  description: Concept lessons, playgrounds, graded labs, capstones and quizzes covering every published objective in this KCSA domain.
  certification:
    name: Kubernetes and Cloud Native Security Associate
    code: KCSA
    provider: CNCF / Linux Foundation
    domain: Kubernetes Security Fundamentals
    weight: 22
    competencies:
    - Pod Security Standards
    - Pod Security Admissions
    - Authentication
    - Authorization
    - Secrets
    - Isolation and Segmentation
    - Audit Logging
    - Network Policy
modules:
  - id: module-intro
    title: Introduction
    description: Audience, learning approach, reading requirements and contribution process.
    content:
    - type: reading
      title: Introduction
      path: sections/intro/README.md
    - type: reading
      title: Welcome To The Course
      path: sections/intro/course-01-welcome.md
    - type: reading
      title: Get Your Machine Ready
      path: sections/intro/course-02-get-your-machine-ready.md
    - type: reading
      title: How This Course Is Made
      path: sections/intro/course-03-how-this-course-is-made.md
  - id: module-010
    title: "Pod Security Standards"
    description: "Security contexts, the Privileged, Baseline and Restricted profiles, and fixing workloads so they meet the Restricted profile."
    status: alpha
    content:
      - type: reading
        title: "Pod Security Standards: Introduction"
        path: sections/section-010/README.md
      - type: reading
        title: "Pod Security Profiles"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Security Contexts And Profile Requirements"
        path: sections/section-010/module-01/course-01-security-contexts-and-profile-requirements.md
      - type: reading
        title: "Profiles And Compliant Workloads"
        path: sections/section-010/module-01/course-02-profiles-and-compliant-workloads.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Pod Security Profiles Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: workload-security
        task_kind: migration
        tags: [pod-security-standards, security-context, restricted, capabilities, hostpath, privileged]
        learning_goals:
          - Add a restricted securityContext with a numeric runAsUser
          - Remove a hostPath volume and a privileged container
          - Keep the namespace level and the Deployments intact
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-03-summary.md
      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Pod Security Standards Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 30m
        topic: workload-security
        task_kind: build
        tags: [pod-security-standards, pod-security-admission, restricted, hostpath, hostpid, privileged]
        learning_goals:
          - Enforce, warn and audit restricted with a pinned version
          - Remove privileged, SYS_ADMIN, hostPID and hostPath from three Deployments
          - Prove a privileged pod is refused and leave another namespace alone
      - type: quiz
        title: "Knowledge Check: Pod Security Standards"
        path: sections/section-010/quiz.yaml
        pass_score: 70
