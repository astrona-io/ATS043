# Reading-only course. YAML assessments are registered separately in assessments/index.yaml.
training:
  id: ATS043
  title: 'KCSA: Kubernetes Security Fundamentals'
  description: Concept lessons, diagrams and original scenario assessments covering every published objective
    in this KCSA domain. No labs or playgrounds.
  certification:
    name: Kubernetes and Cloud Native Security Associate
    code: KCSA
    provider: CNCF / Linux Foundation
    domain: Kubernetes Security Fundamentals
    weight: 22
    competencies:
    - Pod Security Standards
    - Pod Security Admissions
    - Authentication
    - Authorization
    - Secrets
    - Isolation and Segmentation
    - Audit Logging
    - Network Policy
