apiVersion: v1
kind: Namespace
metadata:
  name: dock
---
apiVersion: v1
kind: Namespace
metadata:
  name: yard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tug
  namespace: dock
  labels:
    app: tug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tug
  template:
    metadata:
      labels:
        app: tug
    spec:
      containers:
        - name: tug
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crane
  namespace: dock
  labels:
    app: crane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crane
  template:
    metadata:
      labels:
        app: crane
    spec:
      containers:
        - name: crane
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - containerPort: 9898
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forklift
  namespace: yard
  labels:
    app: forklift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forklift
  template:
    metadata:
      labels:
        app: forklift
    spec:
      containers:
        - name: forklift
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
