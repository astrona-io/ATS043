apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-sa
  namespace: tenant-b
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-edit
  namespace: tenant-b
subjects:
  - kind: ServiceAccount
    name: ops-sa
    namespace: tenant-b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-edit
  namespace: tenant-a
subjects:
  - kind: ServiceAccount
    name: ops-sa
    namespace: tenant-b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: tenant-a
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: curlimages/curl:8.22.0
          ports:
            - containerPort: 8080
          command: ["sleep", "86400"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: tenant-b
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      hostPID: true
      volumes:
        - name: host
          hostPath:
            path: /var/log
      containers:
        - name: probe
          image: curlimages/curl:8.22.0
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: host
              mountPath: /host-log
              readOnly: true
          command: ["sleep", "86400"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
