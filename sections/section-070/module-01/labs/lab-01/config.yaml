# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Audit Policy And Security Evidence (LAB). Graded against the live cluster. Turn on audit logging with a policy that keeps secret values out of the log.
apiVersion: astrona.io/v1
metadata:
  name: ats-043-lab-070-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state, including the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by astrona test: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: audit-logging-enabled
      description: The API server runs with an audit policy file and writes /var/log/kubernetes/audit/audit.log
      type: file
      source: validation/validate-audit-logging-enabled.sh
      hint: "Add --audit-policy-file and --audit-log-path to the kube-apiserver static pod manifest with volumes and mounts for both directories, then wait for the restart."
    - name: secret-metadata-only
      description: A Secret read is recorded at Metadata level with no request or response body
      type: file
      source: validation/validate-secret-metadata-only.sh
      hint: "Put the Secret rule before any rule that gives a higher level. Metadata keeps the body out of the log."
    - name: deployment-bodies-recorded
      description: Creating and deleting a Deployment are recorded at RequestResponse with both bodies
      type: file
      source: validation/validate-deployment-bodies-recorded.sh
      hint: "Add a rule for the resource deployments in the group apps with level RequestResponse, before the catch-all rule."
    - name: noise-dropped
      description: Health checks and the RequestReceived stage are not recorded
      type: file
      source: validation/validate-noise-dropped.sh
      hint: "Add a level None rule for the health paths and put RequestReceived in omitStages."

teardown:
  keepCluster: false
