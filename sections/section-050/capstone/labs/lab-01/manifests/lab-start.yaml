apiVersion: v1
kind: Namespace
metadata:
  name: depot
---
apiVersion: v1
kind: Secret
metadata:
  name: api-token
  namespace: depot
type: Opaque
stringData:
  token: token-1
---
apiVersion: v1
kind: Secret
metadata:
  name: probe-key
  namespace: depot
type: Opaque
stringData:
  key: key-1
---
apiVersion: v1
kind: Secret
metadata:
  name: old-api-token
  namespace: depot
type: Opaque
stringData:
  token: token-0
---
apiVersion: v1
kind: Secret
metadata:
  name: spare-ssh-key
  namespace: depot
type: Opaque
stringData:
  key: spare
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: depot
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sleep", "86400"]
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: depot
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: probe
          image: curlimages/curl:8.22.0
          command: ["sleep", "86400"]
          volumeMounts:
            - name: key
              mountPath: /etc/probe/key
              subPath: key
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: key
          secret:
            secretName: probe-key
