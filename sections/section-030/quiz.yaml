# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats043-030
course_id: ATS043
exam_code: KCSA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Authentication"
questions:
  - id: ats043-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Distinguish authentication failure from authorization failure"
    source_readings:
      - sections/section-030/module-01/course-01-api-identity-and-serviceaccounts.md
    prompt: "A request returns `403 Forbidden` and the message names `User \"system:serviceaccount:starfleet:default\"`. What does this tell you?"
    options:
      - id: a
        text: "Authentication failed because the token expired."
        explanation: "Authentication failure returns 401, not 403."
      - id: b
        text: "Authentication succeeded and authorization refused the identity."
        explanation: "Correct. A 403 names a known identity that lacks permission."
      - id: c
        text: "The admission controller rejected the object."
        explanation: "Admission rejections have their own error text, such as a policy message."
      - id: d
        text: "The API server is unreachable."
        explanation: "An unreachable API server returns no HTTP status."
    correct_option: b
    explanation: "401 means authentication failed. 403 means the identity is known and not permitted."

  - id: ats043-030-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the credential types the API server accepts"
    source_readings:
      - sections/section-030/module-01/course-01-api-identity-and-serviceaccounts.md
    prompt: "Where does Kubernetes store the user `mira` that a client certificate with `CN=mira` represents?"
    options:
      - id: a
        text: "In a User object in the kube-system namespace"
        explanation: "Kubernetes has no User object."
      - id: b
        text: "In etcd under /users"
        explanation: "No such key exists."
      - id: c
        text: "Nowhere. The name is read from the certificate."
        explanation: "Correct. The authenticator reads the Common Name and Organization fields."
      - id: d
        text: "In the ServiceAccount named mira"
        explanation: "ServiceAccounts are separate identities for workloads."
    correct_option: c
    explanation: "A valid certificate signed by the cluster CA is enough to be a user."

  - id: ats043-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the credential types the API server accepts"
    source_readings:
      - sections/section-030/module-01/course-01-api-identity-and-serviceaccounts.md
    prompt: "Which group does the API server add to every identity that passes authentication?"
    options:
      - id: a
        text: "system:masters"
        explanation: "This group is bound to cluster-admin and is not added automatically."
      - id: b
        text: "system:authenticated"
        explanation: "Correct. It is added to all authenticated identities."
      - id: c
        text: "system:serviceaccounts"
        explanation: "Only ServiceAccount identities have this group."
      - id: d
        text: "system:nodes"
        explanation: "This group is for kubelet identities."
    correct_option: b
    explanation: "A binding to `system:authenticated` therefore reaches every authenticated caller."

  - id: ats043-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Distinguish authentication failure from authorization failure"
    source_readings:
      - sections/section-030/module-01/course-01-api-identity-and-serviceaccounts.md
    prompt: "What does `kubectl --as=system:anonymous get pods` test?"
    options:
      - id: a
        text: "Whether the API server accepts requests with no credential"
        explanation: "Impersonation never removes your own credential."
      - id: b
        text: "The authorization decision for the impersonated identity"
        explanation: "Correct. Authentication still uses your credential; authorization evaluates the impersonated user."
      - id: c
        text: "Whether anonymous authentication is enabled"
        explanation: "This command cannot show the flag."
      - id: d
        text: "The audit policy"
        explanation: "Audit is not tested by this command."
    correct_option: b
    explanation: "Impersonation changes the identity authorization sees, not how you authenticate."

  - id: ats043-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain bound ServiceAccount tokens, their audience and lifetime"
    source_readings:
      - sections/section-030/module-01/course-02-serviceaccount-tokens-and-client-certificates.md
    prompt: "Which property is true of a bound ServiceAccount token delivered by the kubelet?"
    options:
      - id: a
        text: "It never expires."
        explanation: "That describes a legacy token Secret."
      - id: b
        text: "It is a signed JWT with an audience and an expiry that stops working when its Pod is deleted."
        explanation: "Correct. These are the properties of a bound token."
      - id: c
        text: "It is stored as a Secret in the namespace."
        explanation: "Bound tokens are projected into the Pod, not stored as Secrets."
      - id: d
        text: "It is valid for any audience."
        explanation: "The audience limits which service should accept it."
    correct_option: b
    explanation: "Bound tokens limit lifetime, audience and the object they belong to."

  - id: ats043-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Stop a workload from receiving a token it does not need"
    source_readings:
      - sections/section-030/module-01/course-02-serviceaccount-tokens-and-client-certificates.md
    prompt: "You set `automountServiceAccountToken: false` on a ServiceAccount. What happens to Pods that already run?"
    options:
      - id: a
        text: "The token volume is removed at once."
        explanation: "Pod volumes are fixed at creation."
      - id: b
        text: "Nothing changes until the Pods are recreated."
        explanation: "Correct. Only new Pods use the new value."
      - id: c
        text: "The Pods are restarted by the kubelet."
        explanation: "Changing a ServiceAccount never restarts Pods."
      - id: d
        text: "The token is revoked."
        explanation: "The existing token stays valid until it expires or the Pod is deleted."
    correct_option: b
    explanation: "Roll out the workload after the change."

  - id: ats043-030-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Issue a user certificate through the CertificateSigningRequest API"
    source_readings:
      - sections/section-030/module-01/course-02-serviceaccount-tokens-and-client-certificates.md
    prompt: "Why should an approver read a CSR subject before approving it?"
    options:
      - id: a
        text: "The API server rejects any subject with a group."
        explanation: "It does not; groups are allowed."
      - id: b
        text: "The signer writes the requested user name and groups into the certificate, so a request with `O=system:masters` becomes an administrator."
        explanation: "Correct. The approver is the control."
      - id: c
        text: "Approval deletes the private key."
        explanation: "The API server never sees the private key."
      - id: d
        text: "Approval creates a User object."
        explanation: "Kubernetes has no User objects."
    correct_option: b
    explanation: "The approval step is the security check for CSRs."

  - id: ats043-030-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Issue a user certificate through the CertificateSigningRequest API"
    source_readings:
      - sections/section-030/module-01/course-02-serviceaccount-tokens-and-client-certificates.md
    prompt: "A client certificate for `mira` was stolen. What can the cluster administrator do?"
    options:
      - id: a
        text: "Revoke it with `kubectl certificate revoke`."
        explanation: "No revoke command exists."
      - id: b
        text: "Remove the permissions granted to mira and wait for the certificate to expire."
        explanation: "Correct. The API server has no certificate revocation list, so the lifetime and the permissions are the controls."
      - id: c
        text: "Delete the User object."
        explanation: "No User object exists."
      - id: d
        text: "Rotate the ServiceAccount token."
        explanation: "That does not affect a client certificate."
    correct_option: b
    explanation: "Use short `expirationSeconds` values for client certificates."

