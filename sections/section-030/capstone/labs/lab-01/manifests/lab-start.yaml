apiVersion: v1
kind: Namespace
metadata:
  name: fleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle-sa
  namespace: fleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drifter-sa
  namespace: fleet
---
apiVersion: v1
kind: Secret
metadata:
  name: shuttle-sa-token
  namespace: fleet
  annotations:
    kubernetes.io/service-account.name: shuttle-sa
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: drifter-sa-token
  namespace: fleet
  annotations:
    kubernetes.io/service-account.name: drifter-sa
type: kubernetes.io/service-account-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: fleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      serviceAccountName: shuttle-sa
      containers:
        - name: shuttle
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - containerPort: 9898
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifter
  namespace: fleet
  labels:
    app: drifter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drifter
  template:
    metadata:
      labels:
        app: drifter
    spec:
      serviceAccountName: drifter-sa
      containers:
        - name: drifter
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - containerPort: 9898
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
