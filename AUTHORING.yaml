sections:
- id: section-010
  title: Pod Security Standards
  curriculum_item: Pod Security Standards
  modules:
  - id: module-01
    title: Pod Security Profiles
    objectives:
    - Compare Privileged, Baseline and Restricted profiles.
    - Explain the purpose and limits of security-context fields.
    - Relate image users and writable paths to profile compatibility.
    - Distinguish compliant configuration from complete application security.
    outline:
    - Security Contexts And Profile Requirements
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
- id: section-020
  title: Pod Security Admissions
  curriculum_item: Pod Security Admissions
  modules:
  - id: module-01
    title: Pod Security Admission Decisions
    objectives:
    - Distinguish enforce, warn and audit policy modes.
    - Explain namespace policy labels and version selection.
    - Predict the effect of policy changes on new workload Pods.
    - Separate Pod Security Admission from RBAC and image verification.
    outline:
    - Applying Pod Security Requirements At Admission
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
- id: section-030
  title: Authentication
  curriculum_item: Authentication
  modules:
  - id: module-01
    title: Authentication And Workload Credentials
    objectives:
    - Distinguish established identity from granted API permission.
    - Explain ServiceAccount token audience and lifetime.
    - Identify unnecessary credential mounting and disclosure paths.
    - Relate authentication failure to the actual credential mechanism.
    outline:
    - API Identity And ServiceAccounts
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: true
- id: section-040
  title: Authorization
  curriculum_item: Authorization
  modules:
  - id: module-01
    title: Authorization And Effective Permissions
    objectives:
    - Compare Role, ClusterRole, RoleBinding and ClusterRoleBinding.
    - Evaluate namespace scope, verbs, resources and subjects.
    - Explain additive grants and indirect privilege.
    - Apply least privilege to a workload identity.
    outline:
    - RBAC Grants And Their Consequences
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
- id: section-050
  title: Secrets
  curriculum_item: Secrets
  modules:
  - id: module-01
    title: Secret Delivery And Credential Lifecycle
    objectives:
    - Explain why Secret encoding is not encryption.
    - Compare environment and mounted-file update behavior.
    - Identify authorization and diagnostic exposure risks.
    - Describe rotation that updates consumers and revokes old authority.
    outline:
    - Secret Storage, Delivery And Rotation
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
- id: section-060
  title: Isolation and Segmentation
  curriculum_item: Isolation and Segmentation
  modules:
  - id: module-01
    title: Isolation And Namespace Segmentation
    objectives:
    - Distinguish namespace scope from physical or kernel isolation.
    - Compare API, network, process and resource controls.
    - Relate shared-node trust to workload compromise.
    - Identify residual access through legitimate dependencies.
    outline:
    - Segmentation Across Trust Boundaries
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: true
- id: section-070
  title: Audit Logging
  curriculum_item: Audit Logging
  modules:
  - id: module-01
    title: Audit Policy And Security Evidence
    objectives:
    - Explain what Kubernetes audit events record.
    - Compare Metadata, Request and RequestResponse audit detail.
    - Relate audit retention and protection to investigation.
    - Distinguish API evidence from runtime and application evidence.
    outline:
    - Designing Useful And Protected Audit Records
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: false
- id: section-080
  title: Network Policy
  curriculum_item: Network Policy
  modules:
  - id: module-01
    title: NetworkPolicy Semantics And Verification
    objectives:
    - Explain Pod selection and direction-specific network isolation.
    - Evaluate additive allowed rules and selector structure.
    - Relate DNS and dependencies to egress requirements.
    - Distinguish declared policy from actual implementation enforcement.
    outline:
    - Traffic Isolation And Allowed Peers
    playground: false
    module_lab: false
    diagrams: []
  capstone: false
  section_quiz: true
